# 指示文書 (CLAUDE.md・AGENTS.md など) と既存コードの食い違いを、週に1回精査する。
# 直した食い違いは pull request に、判断が要る食い違いだけの場合は issue にまとめる。
#
# audit job は書き込み権限を持たず、Claude が文書を直して報告を書き出す。受け渡すのは patch と報告だけで、
# publish job が別の runner の新しい checkout で patch を検証してから、pull request か issue を作る。
#
# 準備:
#   - secret CLAUDE_CODE_OAUTH_TOKEN を登録する (API key を使う場合は anthropic_api_key に差し替える)
#   - Settings > Actions > General で「Allow GitHub Actions to create and approve pull requests」を有効にする
name: instruction-drift

on:
  schedule:
    # 毎週月曜 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: instruction-drift
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_report: ${{ steps.export.outputs.has_report }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Claude の実行後に git を動かす前に、.git の設定と hook が変わっていない事を確かめるため
      - name: Snapshot git config
        id: snapshot
        run: echo "digest=$(find .git/config .git/hooks .git/info -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/kinjo1130/kinjo1130-skills.git
          plugins: instruction-drift@kinjo1130-skills
          prompt: |
            instruction-drift:instruction-drift skill に従い、このリポジトリの指示文書と既存コードの食い違いを精査し、文書を直す。
            報告先は ${{ runner.temp }}/instruction-drift/report.md にする。食い違いが無ければ、このファイルを作らない。
            commit・push・pull request・issue の操作は後続の job が行うので、行わない。
          claude_args: |
            --allowedTools "Skill,Read,Glob,Grep,Edit,Write,Bash(git log:*),Bash(git blame:*)"
            --disallowedTools "Edit(./.git/**),Write(./.git/**)"
            --add-dir ${{ runner.temp }}/instruction-drift

      - name: Export patch and report
        id: export
        env:
          GIT_DIGEST: ${{ steps.snapshot.outputs.digest }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          digest=$(find .git/config .git/hooks .git/info -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          if [ "$digest" != "$GIT_DIGEST" ]; then
            echo "::error::.git の設定か hook が変更された"
            exit 1
          fi
          out="$RUNNER_TEMP/instruction-drift"
          mkdir -p "$out"
          if [ ! -f "$out/report.md" ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false add -A
          git diff --cached --binary --no-ext-diff --no-textconv > "$out/changes.patch"
          echo "has_report=true" >> "$GITHUB_OUTPUT"

      - if: steps.export.outputs.has_report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instruction-drift
          path: |
            ${{ runner.temp }}/instruction-drift/report.md
            ${{ runner.temp }}/instruction-drift/changes.patch
          retention-days: 7

  publish:
    needs: audit
    if: needs.audit.outputs.has_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: instruction-drift
          path: ${{ runner.temp }}/instruction-drift

      - name: Validate and apply patch
        id: apply
        run: |
          patch="$RUNNER_TEMP/instruction-drift/changes.patch"
          if [ ! -s "$patch" ]; then
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git apply "$patch"
          git add -A

          # skill は文書だけを直す。git が列挙した変更を1件ずつ確かめ、想定外の形が1つでもあれば何も出さずに失敗させる
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r old_mode new_mode _ _ status <<< "${meta#:}"
            reason=""
            case "$status" in A|M|D) ;; *) reason="status $status" ;; esac
            case "$old_mode $new_mode" in "000000 100644"|"100644 100644"|"100644 000000") ;; *) reason="mode $old_mode -> $new_mode" ;; esac
            case "$path" in *[[:cntrl:]]*) reason="制御文字を含むパス" ;; esac
            case "$path" in .git/*|*/.git/*) reason=".git 配下" ;; esac
            case "$path" in *.md|*.mdc) ;; *) reason="${reason:-文書以外のファイル}" ;; esac
            if [ -n "$reason" ]; then
              echo "::error::文書以外の変更を含む patch を拒否した ($reason)"
              printf '%q\n' "$path"
              exit 1
            fi
          done < <(git diff --cached --raw -z --no-renames)

          if git diff --cached --quiet; then
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "kind=pr" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.apply.outputs.kind == 'pr'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: instruction-drift/auto
          commit-message: "docs: 指示文書をコードに合わせる"
          title: 指示文書をコードに合わせる
          body-path: ${{ runner.temp }}/instruction-drift/report.md
          labels: instruction-drift
          delete-branch: true

      - name: Open or update issue
        if: steps.apply.outputs.kind == 'issue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create instruction-drift --color c5def5 --force
          # label は triage 以上の権限が無いと付けられず、author も github-actions に絞るので、第三者の issue は拾わない
          number=$(gh issue list --state open --label instruction-drift --author app/github-actions --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/instruction-drift/report.md"
          else
            gh issue create --title "指示文書とコードの食い違い (要判断)" --label instruction-drift --body-file "$RUNNER_TEMP/instruction-drift/report.md"
          fi
